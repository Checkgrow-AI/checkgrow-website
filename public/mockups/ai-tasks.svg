<svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="AI Tasks — manage projects with AI, automated statuses and AI-recommended next tasks">
  <defs>
    <filter id="shadowMd" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#181818" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowLg" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#181818" flood-opacity="0.10"/>
    </filter>
    <filter id="shadowSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#181818" flood-opacity="0.07"/>
    </filter>
  </defs>

  <style>
/* Website dark palette. Keep this branch-local skin separate from the
       shared light mockup sources; geometry, media and timing stay intact. */
    svg { color-scheme: dark; }
    rect[fill="#FFFFFF"], circle[fill="#FFFFFF"], ellipse[fill="#FFFFFF"],
    rect[fill="#F7F7F5"], circle[fill="#F7F7F5"] { fill: #262526; }
    [fill="#F2F2EF"], [fill="#F3F3F0"], [fill="#F5F5F2"] { fill: #181818; }
    [fill="#ECECE9"], [fill="#D8D8D4"], [fill="#DBDBD7"],
    [fill="#E8E8E4"], [fill="#DCDCD8"] { fill: #454247; }
    [stroke="#ECECE9"], [stroke="#DBDBD7"], [stroke="#D8D8D4"],
    [stroke="#E8E8E4"] { stroke: #454247; }
    [fill="#181818"] { fill: #F7F7F5; }
    text[fill="#FFFFFF"] { fill: #000000; }
    [stroke="#181818"] { stroke: #F7F7F5; }
    [fill="#404040"], [fill="#9B9B9B"] { fill: #B7B5BB; }
    [stroke="#404040"], [stroke="#9B9B9B"] { stroke: #B7B5BB; }
    [fill="#E4EAFD"], [fill="#EDF1FE"], [fill="#EBEEFE"] { fill: #30324F; }
    [fill="#5B67D8"] { fill: #9BA6FF; }
    [stroke="#5B67D8"] { stroke: #9BA6FF; }
    [fill="#D4F0E3"], [fill="#E8F5EE"] { fill: #18372B; }
    [fill="#DEDEDA"], [fill="#DEDEDa"] { fill: #454247; }
    [fill="#FEF3D8"] { fill: #3A301C; }
    [fill="#A06A00"] { fill: #E9C77D; }
    [fill="#FDEAEA"] { fill: #421F23; }
    [fill="#C0252A"] { fill: #FFB4AB; }
    [fill="#1E7A4F"], [fill="#3DAA74"] { fill: #75D9A5; }
    [stroke="#1E7A4F"], [stroke="#3DAA74"] { stroke: #75D9A5; }
    [flood-color="#181818"] { flood-color: #000000; flood-opacity: 0.35; }
    .a { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; }

    @keyframes haloIn { 0% {opacity:0} 8% {opacity:1} 96% {opacity:1} 100% {opacity:0} }
    .halo { animation-name: haloIn; }

    @keyframes cardIn {
      0%, 3% { opacity:0; transform: translateY(18px) scale(0.965); }
      8.5%   { opacity:1; transform: translateY(-2px) scale(1.006); }
      11%    { transform: translateY(0) scale(1); }
      96%    { opacity:1; transform: none; }
      100%   { opacity:0; transform: none; }
    }
    .card { animation-name: cardIn; transform-box: fill-box; transform-origin: center; }

    @keyframes rowIn1 { 0%,8%  {opacity:0; transform:translateY(10px)} 13% {opacity:1; transform:translateY(0)} 100% {opacity:1} }
    @keyframes rowIn2 { 0%,10% {opacity:0; transform:translateY(10px)} 15% {opacity:1; transform:translateY(0)} 100% {opacity:1} }
    @keyframes rowIn3 { 0%,12% {opacity:0; transform:translateY(10px)} 17% {opacity:1; transform:translateY(0)} 100% {opacity:1} }
    .row1{animation-name:rowIn1}.row2{animation-name:rowIn2}.row3{animation-name:rowIn3}

    @keyframes sideIn1 { 0%,14% {opacity:0; transform:scale(0)} 17% {opacity:1; transform:scale(1.1)} 19% {transform:scale(1)} 96% {opacity:1; transform:scale(1)} 100% {opacity:0; transform:scale(1)} }
    @keyframes sideIn2 { 0%,16% {opacity:0; transform:scale(0)} 19% {opacity:1; transform:scale(1.1)} 21% {transform:scale(1)} 96% {opacity:1; transform:scale(1)} 100% {opacity:0; transform:scale(1)} }
    .side1{animation-name:sideIn1; transform-box:fill-box; transform-origin:center}
    .side2{animation-name:sideIn2; transform-box:fill-box; transform-origin:center}

    @keyframes floatY { 0%{transform:translateY(0)} 50%{transform:translateY(-4px)} 100%{transform:translateY(0)} }
    .floatB { animation: floatY 5.4s ease-in-out infinite; animation-delay: -2.2s; }
    .floatC { animation: floatY 5s ease-in-out infinite; animation-delay: -1.1s; }

    /* Beat 1: AI writes row-2 description */
    @keyframes descWrite { 0%,22% {transform:scaleX(0)} 30% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
    .descBar { animation-name: descWrite; transform-box: fill-box; transform-origin: 0% 50%; }
    @keyframes writeSpark {
      0%,22% {opacity:0}
      24% {opacity:1} 26% {opacity:0.35} 28% {opacity:1}
      30.5%,100% {opacity:0}
    }
    .writeSpark { animation-name: writeSpark; }
    @keyframes aiBadgeIn { 0%,30% {opacity:0; transform:scale(0)} 32.5% {opacity:1; transform:scale(1.15)} 34% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    .aiBadge { animation-name: aiBadgeIn; transform-box: fill-box; transform-origin: center; }

    /* Beat 2: automation completes row 1 */
    @keyframes tickIn { 0%,37% {opacity:0; transform:scale(0)} 39.5% {opacity:1; transform:scale(1.2)} 41% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    .tick { animation-name: tickIn; transform-box: fill-box; transform-origin: center; }
    @keyframes pendOut { 0%,8% {opacity:0} 13% {opacity:1} 41% {opacity:1} 43.5%,100% {opacity:0} }
    @keyframes doneIn  { 0%,42.5% {opacity:0; transform:scale(0.7)} 44.5% {opacity:1; transform:scale(1.12)} 46% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    .pend1 { animation-name: pendOut; }
    .done1 { animation-name: doneIn; transform-box: fill-box; transform-origin: center; }

    /* Beat 3: recommended card arrives */
    @keyframes recIn { 0%,48% {opacity:0; transform:translateY(26px)} 53.5% {opacity:1; transform:translateY(-3px)} 55.5% {transform:translateY(0)} 96% {opacity:1} 100% {opacity:0} }
    .rec { animation-name: recIn; }
    @keyframes recBadge1 { 0%,55% {opacity:0; transform:scale(0)} 57.5% {opacity:1; transform:scale(1.15)} 59% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    @keyframes recBadge2 { 0%,57% {opacity:0; transform:scale(0)} 59.5% {opacity:1; transform:scale(1.15)} 61% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    .recB1{animation-name:recBadge1; transform-box:fill-box; transform-origin:center}
    .recB2{animation-name:recBadge2; transform-box:fill-box; transform-origin:center}

    /* Beat 4: add task click, dot, new row */
    @keyframes addClick {
      0%, 62% { transform: scale(1); }
      63.2%   { transform: scale(0.92); }
      64.5%   { transform: scale(1); }
      100%    { transform: scale(1); }
    }
    .addBtn { animation-name: addClick; transform-box: fill-box; transform-origin: center; }
    @keyframes clickRipple {
      0%, 62.8% { opacity: 0; transform: scale(0.5); }
      63.5%     { opacity: 0.7; transform: scale(0.8); }
      67%       { opacity: 0; transform: scale(1.5); }
      100%      { opacity: 0; transform: scale(1.5); }
    }
    .ripple { animation-name: clickRipple; transform-box: fill-box; transform-origin: center; }

    @keyframes linkIn { 0%,64% {opacity:0} 67% {opacity:0.9} 96% {opacity:0.9} 100% {opacity:0} }
    .links { animation-name: linkIn; }
    @keyframes dotV { 0%,65.6% {opacity:0} 67% {opacity:1} 70.6% {opacity:1} 72%,100% {opacity:0} }
    .dot { animation-name: dotV; }

    @keyframes row4In { 0%,71.5% {opacity:0; transform:translateY(8px)} 76% {opacity:1; transform:translateY(0)} 100% {opacity:1} }
    .row4 { animation-name: row4In; }
    @keyframes tintFlash {
      0%,71.5% {opacity:0}
      74%      {opacity:0.85}
      80%      {opacity:0.35}
      100%     {opacity:0.35}
    }
    .tint { animation-name: tintFlash; }
    @keyframes newIn { 0%,76% {opacity:0; transform:scale(0)} 78.5% {opacity:1; transform:scale(1.15)} 80% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    .newPill { animation-name: newIn; transform-box: fill-box; transform-origin: center; }

    @keyframes cap1 { 0%,16% {opacity:0} 20% {opacity:1} 74% {opacity:1} 76.5%,100% {opacity:0} }
    @keyframes cap2 { 0%,76.5% {opacity:0} 79% {opacity:1} 100% {opacity:1} }
    .cap1{animation-name:cap1}.cap2{animation-name:cap2}

    @keyframes twinkle { 0%,100% {transform:scale(1) rotate(0deg)} 50% {transform:scale(1.18) rotate(12deg)} }
    .sparkle { animation: twinkle 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Halo rings (transparent canvas) -->
  <g class="a halo">
    <circle cx="400" cy="400" r="360" fill="#FFFFFF" opacity="0.28"/>
    <circle cx="400" cy="400" r="280" fill="#FFFFFF" opacity="0.42"/>
    <circle cx="400" cy="400" r="200" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- Connector: recommended card -> task list -->
  <g class="a links" stroke="#CFC3D9" stroke-width="1.6" stroke-dasharray="1 6" stroke-linecap="round" fill="none">
    <path d="M 385 548 C 345 528, 305 505, 282 474"/>
  </g>

  <!-- Hero card: Tasks -->
  <g class="a card">
    <g filter="url(#shadowMd)">
      <rect x="185" y="185" width="430" height="380" rx="20" fill="#FFFFFF"/>
    </g>

    <rect x="213" y="209" width="30" height="30" rx="9" fill="#E4EAFD"/>
    <g stroke="#5B67D8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 220.5 217.5 L 222.5 219.5 L 226 215.5"/>
      <line x1="230" y1="217.5" x2="236" y2="217.5"/>
      <path d="M 220.5 226.5 L 222.5 228.5 L 226 224.5"/>
      <line x1="230" y1="226.5" x2="236" y2="226.5"/>
    </g>
    <text x="253" y="225" font-size="17" font-weight="600" fill="#181818">Tasks</text>
    <text x="253" y="244" font-size="11.5" fill="#9B9B9B">Manage projects with AI</text>
    <g fill="#D8D8D4">
      <circle cx="551" cy="224" r="2"/><circle cx="559" cy="224" r="2"/><circle cx="567" cy="224" r="2"/>
    </g>

    <!-- Row 1 -->
    <g class="a row1">
      <rect x="213" y="270" width="18" height="18" rx="5" fill="#FFFFFF" stroke="#D8D8D4" stroke-width="1.6"/>
      <g class="a tick">
        <rect x="213" y="270" width="18" height="18" rx="5" fill="#9BA6FF"/>
        <path d="M 217.5 279 L 220.5 282 L 226.5 275.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="245" y="282" font-size="13.5" font-weight="600" fill="#181818">QA Testing: AI Agents</text>
      <rect x="245" y="292" width="150" height="5" rx="2.5" fill="#ECECE9"/>
      <rect x="445" y="271" width="70" height="20" rx="10" fill="#FEF3D8"/>
      <text x="480" y="284.5" font-size="10.5" font-weight="600" fill="#A06A00" text-anchor="middle">Campaign</text>
      <g class="a pend1" opacity="0">
        <rect x="523" y="270" width="64" height="22" rx="11" fill="#F2F2EF"/>
        <text x="555" y="284.5" font-size="11" font-weight="600" fill="#404040" text-anchor="middle">Pending</text>
      </g>
      <g class="a done1">
        <rect x="523" y="270" width="64" height="22" rx="11" fill="#D4F0E3"/>
        <text x="555" y="284.5" font-size="11" font-weight="600" fill="#1E7A4F" text-anchor="middle">Done</text>
      </g>
    </g>

    <!-- Row 2 -->
    <g class="a row2">
      <rect x="213" y="328" width="18" height="18" rx="5" fill="#FFFFFF" stroke="#D8D8D4" stroke-width="1.6"/>
      <text x="245" y="340" font-size="13.5" font-weight="600" fill="#181818">Feature Pages: Content</text>
      <rect class="a descBar" x="245" y="350" width="170" height="5" rx="2.5" fill="#ECECE9"/>
      <path class="a writeSpark" opacity="0" d="M 424 346 C 424.8 349.6, 427.1 351.9, 430.7 352.7 C 427.1 353.5, 424.8 355.8, 424 359.4 C 423.2 355.8, 420.9 353.5, 417.3 352.7 C 420.9 351.9, 423.2 349.6, 424 346 Z" fill="#9BA6FF"/>
      <g class="a aiBadge">
        <rect x="419" y="329" width="96" height="20" rx="10" fill="#E4EAFD"/>
        <path d="M 431 334 C 431.7 337.2, 433.8 339.3, 437 340 C 433.8 340.7, 431.7 342.8, 431 346 C 430.3 342.8, 428.2 340.7, 425 340 Z" fill="#5B67D8"/>
        <text x="442" y="343.5" font-size="10.5" font-weight="600" fill="#5B67D8">AI Generated</text>
      </g>
      <rect x="523" y="328" width="64" height="22" rx="11" fill="#F2F2EF"/>
      <text x="555" y="342.5" font-size="11" font-weight="600" fill="#404040" text-anchor="middle">Pending</text>
    </g>

    <!-- Row 3 -->
    <g class="a row3">
      <rect x="213" y="386" width="18" height="18" rx="5" fill="#FFFFFF" stroke="#D8D8D4" stroke-width="1.6"/>
      <text x="245" y="398" font-size="13.5" font-weight="600" fill="#181818">Scalable Keyword Research</text>
      <rect x="245" y="408" width="130" height="5" rx="2.5" fill="#ECECE9"/>
      <rect x="457" y="387" width="58" height="20" rx="10" fill="#FFFFFF" stroke="#CFC3D9" stroke-width="1"/>
      <text x="486" y="400.5" font-size="10.5" font-weight="600" fill="#5B67D8" text-anchor="middle">Project</text>
      <rect x="523" y="386" width="64" height="22" rx="11" fill="#F2F2EF"/>
      <text x="555" y="400.5" font-size="11" font-weight="600" fill="#404040" text-anchor="middle">Pending</text>
    </g>

    <!-- Row 4: added by AI -->
    <rect class="a tint" x="205" y="436" width="398" height="54" rx="10" fill="#E4EAFD" opacity="0.35"/>
    <g class="a row4">
      <rect x="213" y="444" width="18" height="18" rx="5" fill="#FFFFFF" stroke="#D8D8D4" stroke-width="1.6"/>
      <text x="245" y="456" font-size="13.5" font-weight="600" fill="#181818">Launch Cross-Channel Campaign</text>
      <rect x="245" y="466" width="160" height="5" rx="2.5" fill="#ECECE9"/>
      <rect x="471" y="445" width="44" height="20" rx="10" fill="#E4EAFD"/>
      <path d="M 481 450 C 481.7 453.2, 483.8 455.3, 487 456 C 483.8 456.7, 481.7 458.8, 481 462 C 480.3 458.8, 478.2 456.7, 475 456 Z" fill="#5B67D8"/>
      <text x="492" y="459.5" font-size="10.5" font-weight="600" fill="#5B67D8">AI</text>
      <g class="a newPill">
        <rect x="523" y="444" width="64" height="22" rx="11" fill="#E4EAFD"/>
        <text x="555" y="458.5" font-size="11" font-weight="600" fill="#5B67D8" text-anchor="middle">New</text>
      </g>
    </g>

    <g class="a cap1" opacity="0"><text x="213" y="528" font-size="11" fill="#9B9B9B">11 tasks · 3 automated by AI</text></g>
    <g class="a cap2"><text x="213" y="528" font-size="11" fill="#9B9B9B">12 tasks · 3 automated by AI</text></g>
  </g>

  <!-- Dot: recommendation -> list -->
  <circle class="a dot" r="4.5" fill="#9BA6FF" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"
      keyPoints="1;1;0;0" keyTimes="0;0.66;0.715;1"
      path="M 385 548 C 345 528, 305 505, 282 474"/>
  </circle>

  <!-- Floating icon badges -->
  <g class="a side1"><g class="floatB">
    <g filter="url(#shadowSm)"><circle cx="128" cy="320" r="26" fill="#FFFFFF"/></g>
    <g stroke="#404040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 118 314 L 120.5 316.5 L 125 312"/>
      <line x1="130" y1="314.5" x2="139" y2="314.5"/>
      <path d="M 118 325 L 120.5 327.5 L 125 323"/>
      <line x1="130" y1="325.5" x2="139" y2="325.5"/>
    </g>
  </g></g>

  <g class="a side2"><g class="floatC">
    <g filter="url(#shadowSm)"><circle cx="678" cy="300" r="26" fill="#FFFFFF"/></g>
    <g stroke="#404040" stroke-width="1.8" stroke-linecap="round" fill="none">
      <rect x="666" y="290" width="7" height="20" rx="2"/>
      <rect x="675.5" y="290" width="7" height="13" rx="2"/>
      <rect x="685" y="290" width="7" height="16" rx="2"/>
    </g>
  </g></g>

  <!-- Recommended Task card -->
  <g class="a rec">
    <g filter="url(#shadowLg)">
      <rect x="350" y="545" width="300" height="158" rx="16" fill="#FFFFFF"/>
    </g>
    <g class="sparkle">
      <path d="M 378 564 C 378.9 568.2, 381.6 570.9, 385.8 571.8 C 381.6 572.7, 378.9 575.4, 378 579.6 C 377.1 575.4, 374.4 572.7, 370.2 571.8 C 374.4 570.9, 377.1 568.2, 378 564 Z" fill="#5B67D8"/>
    </g>
    <text x="392" y="576" font-size="9.5" font-weight="600" letter-spacing="1" fill="#5B67D8">RECOMMENDED · AI</text>
    <g class="a recB1">
      <rect x="372" y="588" width="44" height="20" rx="10" fill="#FDEAEA"/>
      <text x="394" y="601.5" font-size="10.5" font-weight="600" fill="#C0252A" text-anchor="middle">High</text>
    </g>
    <g class="a recB2">
      <rect x="424" y="588" width="74" height="20" rx="10" fill="#ECECE9"/>
      <text x="461" y="601.5" font-size="10.5" font-weight="600" fill="#404040" text-anchor="middle">Marketing</text>
    </g>
    <text x="372" y="632" font-size="13.5" font-weight="600" fill="#181818">Launch Cross-Channel Campaign</text>
    <rect x="372" y="642" width="180" height="5" rx="2.5" fill="#ECECE9"/>
    <circle class="a ripple" cx="419" cy="673" r="24" stroke="#9BA6FF" stroke-width="2" fill="none" opacity="0"/>
    <g class="a addBtn">
      <rect x="372" y="660" width="94" height="26" rx="13" fill="#9BA6FF"/>
      <text x="419" y="677" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Add task</text>
    </g>
  </g>
</svg>
