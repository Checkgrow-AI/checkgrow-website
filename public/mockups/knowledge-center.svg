<svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Knowledge Center — all company knowledge in one place, read by AI agents">
  <defs>
    <filter id="shadowMd" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#181818" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowLg" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#181818" flood-opacity="0.10"/>
    </filter>
    <filter id="shadowSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#181818" flood-opacity="0.07"/>
    </filter>
  </defs>

  <style>
/* Website dark palette. Keep this branch-local skin separate from the
       shared light mockup sources; geometry, media and timing stay intact. */
    svg { color-scheme: dark; }
    rect[fill="#FFFFFF"], circle[fill="#FFFFFF"], ellipse[fill="#FFFFFF"],
    rect[fill="#F7F7F5"], circle[fill="#F7F7F5"] { fill: #262526; }
    [fill="#F2F2EF"], [fill="#F3F3F0"], [fill="#F5F5F2"] { fill: #181818; }
    [fill="#ECECE9"], [fill="#D8D8D4"], [fill="#DBDBD7"],
    [fill="#E8E8E4"], [fill="#DCDCD8"] { fill: #454247; }
    [stroke="#ECECE9"], [stroke="#DBDBD7"], [stroke="#D8D8D4"],
    [stroke="#E8E8E4"] { stroke: #454247; }
    [fill="#181818"] { fill: #F7F7F5; }
    text[fill="#FFFFFF"] { fill: #000000; }
    [stroke="#181818"] { stroke: #F7F7F5; }
    [fill="#404040"], [fill="#9B9B9B"] { fill: #B7B5BB; }
    [stroke="#404040"], [stroke="#9B9B9B"] { stroke: #B7B5BB; }
    [fill="#E4EAFD"], [fill="#EDF1FE"], [fill="#EBEEFE"] { fill: #30324F; }
    [fill="#5B67D8"] { fill: #9BA6FF; }
    [stroke="#5B67D8"] { stroke: #9BA6FF; }
    [fill="#D4F0E3"], [fill="#E8F5EE"] { fill: #18372B; }
    [fill="#DEDEDA"], [fill="#DEDEDa"] { fill: #454247; }
    [fill="#FEF3D8"] { fill: #3A301C; }
    [fill="#A06A00"] { fill: #E9C77D; }
    [fill="#FDEAEA"] { fill: #421F23; }
    [fill="#C0252A"] { fill: #FFB4AB; }
    [fill="#1E7A4F"], [fill="#3DAA74"] { fill: #75D9A5; }
    [stroke="#1E7A4F"], [stroke="#3DAA74"] { stroke: #75D9A5; }
    [flood-color="#181818"] { flood-color: #000000; flood-opacity: 0.35; }
    .a { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: linear; }

    /* ---------- entrances ---------- */
    @keyframes haloIn { 0% {opacity:0} 8% {opacity:1} 96% {opacity:1} 100% {opacity:0} }
    .halo { animation-name: haloIn; }

    @keyframes cardIn {
      0%, 3% { opacity:0; transform: translateY(18px) scale(0.965); }
      8.5%   { opacity:1; transform: translateY(-2px) scale(1.006); }
      11%    { transform: translateY(0) scale(1); }
      96%    { opacity:1; transform: none; }
      100%   { opacity:0; transform: none; }
    }
    .card { animation-name: cardIn; transform-box: fill-box; transform-origin: center; }

    @keyframes rowIn1 { 0%,8%  {opacity:0; transform:translateY(10px)} 13% {opacity:1; transform:translateY(0)} 100% {opacity:1} }
    @keyframes rowIn2 { 0%,10% {opacity:0; transform:translateY(10px)} 15% {opacity:1; transform:translateY(0)} 100% {opacity:1} }
    @keyframes rowIn3 { 0%,12% {opacity:0; transform:translateY(10px)} 17% {opacity:1; transform:translateY(0)} 100% {opacity:1} }
    @keyframes rowIn4 { 0%,14% {opacity:0; transform:translateY(10px)} 19% {opacity:1; transform:translateY(0)} 100% {opacity:1} }
    .row1{animation-name:rowIn1}.row2{animation-name:rowIn2}.row3{animation-name:rowIn3}.row4{animation-name:rowIn4}

    @keyframes footIn { 0%,16% {opacity:0; transform:translateY(8px)} 21% {opacity:1; transform:translateY(0)} 100% {opacity:1} }
    .foot { animation-name: footIn; }

    @keyframes badgeIn1 { 0%,14% {opacity:0; transform:scale(0)} 17.5% {opacity:1; transform:scale(1.14)} 19.5% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    @keyframes badgeIn2 { 0%,16% {opacity:0; transform:scale(0)} 19.5% {opacity:1; transform:scale(1.14)} 21.5% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    @keyframes badgeIn3 { 0%,18% {opacity:0; transform:scale(0)} 21.5% {opacity:1; transform:scale(1.14)} 23.5% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    .badge1{animation-name:badgeIn1; transform-box:fill-box; transform-origin:center}
    .badge2{animation-name:badgeIn2; transform-box:fill-box; transform-origin:center}
    .badge3{animation-name:badgeIn3; transform-box:fill-box; transform-origin:center}

    @keyframes floatY { 0%{transform:translateY(0)} 50%{transform:translateY(-4px)} 100%{transform:translateY(0)} }
    .float  { animation: floatY 4.6s ease-in-out infinite; }
    .floatB { animation: floatY 5.4s ease-in-out infinite; animation-delay: -2.2s; }
    .floatC { animation: floatY 5s ease-in-out infinite; animation-delay: -1.1s; }

    @keyframes linkIn { 0%,20% {opacity:0} 24% {opacity:0.9} 96% {opacity:0.9} 100% {opacity:0} }
    .links { animation-name: linkIn; }

    /* ---------- knowledge dots ---------- */
    @keyframes dotV1 { 0%,25.6% {opacity:0} 27% {opacity:1} 31.4% {opacity:1} 32.5%,100% {opacity:0} }
    @keyframes dotV2 { 0%,32.6% {opacity:0} 34% {opacity:1} 38.4% {opacity:1} 39.5%,100% {opacity:0} }
    @keyframes dotV3 { 0%,39.6% {opacity:0} 41% {opacity:1} 45.4% {opacity:1} 46.5%,100% {opacity:0} }
    .dot1{animation-name:dotV1}.dot2{animation-name:dotV2}.dot3{animation-name:dotV3}

    /* ---------- check pops ---------- */
    @keyframes chkP1 { 0%,32.5% {opacity:0; transform:scale(0)} 34.5% {opacity:1; transform:scale(1.3)} 36% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    @keyframes chkP2 { 0%,39.5% {opacity:0; transform:scale(0)} 41.5% {opacity:1; transform:scale(1.3)} 43% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    @keyframes chkP3 { 0%,46.5% {opacity:0; transform:scale(0)} 48.5% {opacity:1; transform:scale(1.3)} 50% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    @keyframes chkP4 { 0%,56%   {opacity:0; transform:scale(0)} 58%   {opacity:1; transform:scale(1.3)} 59.5% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    .chk1{animation-name:chkP1; transform-box:fill-box; transform-origin:center}
    .chk2{animation-name:chkP2; transform-box:fill-box; transform-origin:center}
    .chk3{animation-name:chkP3; transform-box:fill-box; transform-origin:center}
    .chk4{animation-name:chkP4; transform-box:fill-box; transform-origin:center}

    @keyframes spinnerVis { 0%,14% {opacity:0} 19% {opacity:1} 55.5% {opacity:1} 57%,100% {opacity:0} }
    .spinner { animation-name: spinnerVis; }

    /* ---------- progress ring ----------
       Circumference of r=26 circle = 163.363. 67% = 109.45.
       The arc lives inside a wrapper group that carries the -90deg start
       rotation; no CSS transforms touch it, so it stays locked in place. */
    @keyframes ringDraw {
      0%, 18%   { stroke-dasharray: 0 163.363; opacity: 0; }
      18.5%     { opacity: 1; }
      27%       { stroke-dasharray: 109.45 163.363; opacity: 1; }
      58%       { stroke-dasharray: 109.45 163.363; opacity: 1; }
      66%       { stroke-dasharray: 163.363 163.363; opacity: 1; }
      100%      { stroke-dasharray: 163.363 163.363; opacity: 1; }
    }
    .ringArc { animation-name: ringDraw; }

    @keyframes pctA { 0%,16% {opacity:0} 21% {opacity:1} 60% {opacity:1} 63%,100% {opacity:0} }
    @keyframes pctB { 0%,62% {opacity:0} 65.5% {opacity:1} 100% {opacity:1} }
    .pct67{animation-name:pctA}.pct100{animation-name:pctB}
    .sub1{animation-name:pctA}.sub2{animation-name:pctB}

    /* ---------- AI agent chip ---------- */
    @keyframes chipIn { 0%,67% {opacity:0; transform:translateY(20px)} 72.5% {opacity:1; transform:translateY(-2px)} 74.5% {transform:translateY(0)} 96% {opacity:1} 100% {opacity:0} }
    .chip { animation-name: chipIn; }

    @keyframes readTxt { 0%,69% {opacity:0} 73% {opacity:1} 84.5% {opacity:1} 86.5%,100% {opacity:0} }
    @keyframes doneTxt { 0%,86.5% {opacity:0} 89% {opacity:1} 100% {opacity:1} }
    .readTxt{animation-name:readTxt}.doneTxt{animation-name:doneTxt}

    @keyframes pulseDot {
      0%,69% {opacity:0}
      73% {opacity:1} 75% {opacity:0.25} 77% {opacity:1} 79% {opacity:0.25} 81% {opacity:1} 83% {opacity:0.25} 85% {opacity:1}
      86.5%,100% {opacity:0}
    }
    .pulseDot { animation-name: pulseDot; }

    @keyframes doneChk { 0%,86.5% {opacity:0; transform:scale(0)} 88.5% {opacity:1; transform:scale(1.3)} 90% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    .doneChk { animation-name: doneChk; transform-box: fill-box; transform-origin: center; }

    @keyframes twinkle { 0%,100% {transform:scale(1) rotate(0deg)} 50% {transform:scale(1.18) rotate(12deg)} }
    .sparkle { animation: twinkle 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Transparent canvas: no background rect, halos are soft white washes
       that read as a gentle glow on any host background -->
  <g class="a halo">
    <circle cx="400" cy="400" r="360" fill="#FFFFFF" opacity="0.28"/>
    <circle cx="400" cy="400" r="280" fill="#FFFFFF" opacity="0.42"/>
    <circle cx="400" cy="400" r="200" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- Dotted connectors -->
  <g class="a links" stroke="#CFC3D9" stroke-width="1.6" stroke-dasharray="1 6" stroke-linecap="round" fill="none">
    <path d="M 184 258 C 215 268, 225 275, 246 283"/>
    <path d="M 152 452 C 185 448, 210 438, 242 420"/>
    <path d="M 640 328 C 620 334, 600 340, 576 346"/>
  </g>

  <!-- Hero card + contents -->
  <g class="a card">
    <g filter="url(#shadowMd)">
      <rect x="210" y="165" width="380" height="440" rx="20" fill="#FFFFFF"/>
    </g>
    <rect x="238" y="191" width="30" height="30" rx="9" fill="#E4EAFD"/>
    <g stroke="#5B67D8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M 253 198.5 L 260 202.5 L 253 206.5 L 246 202.5 Z"/>
      <path d="M 246 206.8 L 253 210.8 L 260 206.8"/>
      <path d="M 246 211 L 253 215 L 260 211"/>
    </g>
    <text x="280" y="207" font-size="17" font-weight="600" fill="#181818">Knowledge Center</text>
    <text x="280" y="226" font-size="11.5" fill="#9B9B9B">All company knowledge, one place</text>
    <g fill="#D8D8D4">
      <circle cx="548" cy="206" r="2"/><circle cx="556" cy="206" r="2"/><circle cx="564" cy="206" r="2"/>
    </g>

    <!-- Row 1: Brand -->
    <g class="a row1">
      <rect x="238" y="256" width="36" height="36" rx="10" fill="#F2F2EF"/>
      <g stroke-width="1.7" fill="none">
        <circle cx="250" cy="274" r="5.5" stroke="#404040"/>
        <circle cx="257" cy="274" r="5.5" stroke="#9BA6FF"/>
        <circle cx="264" cy="274" r="5.5" stroke="#404040" opacity="0.45"/>
      </g>
      <text x="288" y="272" font-size="14" font-weight="600" fill="#181818">Brand</text>
      <rect x="288" y="280" width="120" height="6" rx="3" fill="#ECECE9"/>
      <circle cx="551" cy="274" r="10" stroke="#ECECE9" stroke-width="2" fill="none"/>
      <g class="a chk1">
        <circle cx="551" cy="274" r="11" fill="#D4F0E3"/>
        <path d="M 546 274 L 549.5 277.5 L 556 270.5" stroke="#1E7A4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>

    <!-- Row 2: Products -->
    <g class="a row2">
      <rect x="238" y="314" width="36" height="36" rx="10" fill="#F2F2EF"/>
      <g stroke="#404040" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" fill="none">
        <path d="M 256 323.5 L 263.5 327.5 L 263.5 336.5 L 256 340.5 L 248.5 336.5 L 248.5 327.5 Z"/>
        <path d="M 248.5 327.5 L 256 331.5 L 263.5 327.5"/>
        <path d="M 256 331.5 L 256 340.5"/>
      </g>
      <text x="288" y="330" font-size="14" font-weight="600" fill="#181818">Products</text>
      <rect x="288" y="338" width="150" height="6" rx="3" fill="#ECECE9"/>
      <circle cx="551" cy="332" r="10" stroke="#ECECE9" stroke-width="2" fill="none"/>
      <g class="a chk2">
        <circle cx="551" cy="332" r="11" fill="#D4F0E3"/>
        <path d="M 546 332 L 549.5 335.5 L 556 328.5" stroke="#1E7A4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>

    <!-- Row 3: Buyer Personas -->
    <g class="a row3">
      <rect x="238" y="372" width="36" height="36" rx="10" fill="#F2F2EF"/>
      <g stroke="#404040" stroke-width="1.7" stroke-linecap="round" fill="none">
        <circle cx="253" cy="385.5" r="3.6"/>
        <path d="M 246.5 398 C 246.5 393.6, 249.4 391.4, 253 391.4 C 256.6 391.4, 259.5 393.6, 259.5 398"/>
        <circle cx="262.5" cy="386.5" r="2.9" opacity="0.5"/>
        <path d="M 262 391.8 C 265.2 392.2, 267.3 394.4, 267.3 398" opacity="0.5"/>
      </g>
      <text x="288" y="388" font-size="14" font-weight="600" fill="#181818">Buyer Personas</text>
      <rect x="288" y="396" width="104" height="6" rx="3" fill="#ECECE9"/>
      <circle cx="551" cy="390" r="10" stroke="#ECECE9" stroke-width="2" fill="none"/>
      <g class="a chk3">
        <circle cx="551" cy="390" r="11" fill="#D4F0E3"/>
        <path d="M 546 390 L 549.5 393.5 L 556 386.5" stroke="#1E7A4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>

    <!-- Row 4: Company Profile -->
    <g class="a row4">
      <rect x="238" y="430" width="36" height="36" rx="10" fill="#E4EAFD"/>
      <g stroke="#5B67D8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="249" y="439" width="14" height="18" rx="1.5"/>
        <path d="M 252.5 443.5 h 2.6 M 256.9 443.5 h 2.6 M 252.5 448 h 2.6 M 256.9 448 h 2.6 M 254.7 457 v -4 h 2.6 v 4"/>
      </g>
      <text x="288" y="446" font-size="14" font-weight="600" fill="#181818">Company Profile</text>
      <rect x="288" y="454" width="134" height="6" rx="3" fill="#ECECE9"/>
      <g class="a spinner" opacity="0">
        <circle cx="551" cy="448" r="9" stroke="#ECECE9" stroke-width="2.4" fill="none"/>
        <g>
          <path d="M 551 439 A 9 9 0 0 1 560 448" stroke="#9BA6FF" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <animateTransform attributeName="transform" type="rotate" from="0 551 448" to="360 551 448" dur="1.1s" repeatCount="indefinite"/>
        </g>
      </g>
      <g class="a chk4">
        <circle cx="551" cy="448" r="11" fill="#D4F0E3"/>
        <path d="M 546 448 L 549.5 451.5 L 556 444.5" stroke="#1E7A4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>

    <!-- Footer -->
    <g class="a foot">
      <line x1="238" y1="492" x2="562" y2="492" stroke="#ECECE9" stroke-width="1"/>
      <!-- Track ring -->
      <circle cx="266" cy="548" r="26" stroke="#ECECE9" stroke-width="6" fill="none"/>
      <!-- Progress arc: wrapper g owns the position + start-at-12-o'clock
           rotation via attributes only; the animated circle itself carries
           no transform at all, so the sweep can never drift off the track -->
      <g transform="translate(266 548) rotate(-90)">
        <circle class="a ringArc" cx="0" cy="0" r="26" stroke="#9BA6FF" stroke-width="6" fill="none" stroke-linecap="round"
                stroke-dasharray="163.363 163.363"/>
      </g>
      <g class="a pct67" opacity="0"><text x="266" y="552.5" font-size="13" font-weight="700" fill="#181818" text-anchor="middle">67%</text></g>
      <g class="a pct100"><text x="266" y="552.5" font-size="12" font-weight="700" fill="#181818" text-anchor="middle">100%</text></g>
      <text x="310" y="545" font-size="14" font-weight="600" fill="#181818">Company Knowledge</text>
      <g class="a sub1" opacity="0"><text x="310" y="564" font-size="12" fill="#9B9B9B">3 of 4 sources synced</text></g>
      <g class="a sub2"><text x="310" y="564" font-size="12" fill="#3DAA74">All sources synced</text></g>
    </g>
  </g>

  <!-- Knowledge dots travelling into the card -->
  <circle class="a dot1" r="4.5" fill="#9BA6FF" opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.26;0.325;1"
      path="M 184 258 C 215 268, 225 275, 246 283"/>
  </circle>
  <circle class="a dot2" r="4.5" fill="#9BA6FF" opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.33;0.395;1"
      path="M 640 328 C 620 334, 600 340, 576 346"/>
  </circle>
  <circle class="a dot3" r="4.5" fill="#9BA6FF" opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.40;0.465;1"
      path="M 152 452 C 185 448, 210 438, 242 420"/>
  </circle>

  <!-- Floating source badges -->
  <g class="a badge1">
    <g class="float">
      <g filter="url(#shadowSm)"><circle cx="150" cy="248" r="30" fill="#FFFFFF"/></g>
      <g stroke="#404040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 150 238 V 252"/>
        <path d="M 144 244 L 150 238 L 156 244"/>
        <path d="M 140 254 V 257 C 140 258.6, 141.4 260, 143 260 H 157 C 158.6 260, 160 258.6, 160 257 V 254"/>
      </g>
    </g>
  </g>

  <g class="a badge2">
    <g class="floatB">
      <g filter="url(#shadowSm)"><circle cx="672" cy="322" r="30" fill="#FFFFFF"/></g>
      <g stroke="#404040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 661 315 H 668 L 671 318.5 H 683 C 684.1 318.5, 685 319.4, 685 320.5 V 328.5 C 685 329.6, 684.1 330.5, 683 330.5 H 661 C 659.9 330.5, 659 329.6, 659 328.5 V 317 C 659 315.9, 659.9 315, 661 315 Z"/>
      </g>
    </g>
  </g>

  <g class="a badge3">
    <g class="floatC">
      <g filter="url(#shadowSm)"><circle cx="120" cy="456" r="30" fill="#FFFFFF"/></g>
      <g stroke="#404040" stroke-width="1.9" stroke-linecap="round" fill="none">
        <path d="M 117.5 458.5 L 122.5 453.5"/>
        <path d="M 115 451 L 118.6 447.4 C 121 445, 124.8 445, 127.2 447.4 C 129.6 449.8, 129.6 453.6, 127.2 456 L 123.6 459.6"/>
        <path d="M 125 461 L 121.4 464.6 C 119 467, 115.2 467, 112.8 464.6 C 110.4 462.2, 110.4 458.4, 112.8 456 L 116.4 452.4"/>
      </g>
    </g>
  </g>

  <!-- AI agent chip -->
  <g class="a chip">
    <g filter="url(#shadowLg)">
      <rect x="252" y="583" width="316" height="62" rx="31" fill="#FFFFFF"/>
    </g>
    <circle cx="288" cy="614" r="17" fill="#E4EAFD"/>
    <g class="sparkle">
      <path d="M 288 604.5 C 289.1 609.6, 292.4 612.9, 297.5 614 C 292.4 615.1, 289.1 618.4, 288 623.5 C 286.9 618.4, 283.6 615.1, 278.5 614 Z" fill="#5B67D8"/>
    </g>
    <text x="318" y="610" font-size="13.5" font-weight="600" fill="#181818">AI Agent</text>
    <g class="a readTxt" opacity="0"><text x="318" y="629" font-size="12" fill="#9B9B9B">Reading your knowledge…</text></g>
    <g class="a doneTxt"><text x="318" y="629" font-size="12" fill="#3DAA74">Up to date</text></g>
    <circle class="a pulseDot" cx="541" cy="614" r="4" fill="#9BA6FF" opacity="0"/>
    <g class="a doneChk">
      <circle cx="541" cy="614" r="9" fill="#D4F0E3"/>
      <path d="M 537 614 L 540 617 L 545.5 611" stroke="#1E7A4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>
