<svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Website Report — one-click AI conversion audit with scores and top fixes">
  <defs>
    <filter id="shadowMd" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#181818" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowLg" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#181818" flood-opacity="0.10"/>
    </filter>
    <filter id="shadowSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#181818" flood-opacity="0.07"/>
    </filter>
    <clipPath id="domainClip">
      <rect x="296" y="160" width="110" height="24">
        <animate attributeName="width" values="0;0;110;110" keyTimes="0;0.13;0.20;1" dur="10s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="cardClip">
      <rect x="190" y="248" width="420" height="380" rx="20"/>
    </clipPath>
  </defs>

  <style>
/* Website dark palette. Keep this branch-local skin separate from the
       shared light mockup sources; geometry, media and timing stay intact. */
    svg { color-scheme: dark; }
    rect[fill="#FFFFFF"], circle[fill="#FFFFFF"], ellipse[fill="#FFFFFF"],
    rect[fill="#F7F7F5"], circle[fill="#F7F7F5"] { fill: #262526; }
    [fill="#F2F2EF"], [fill="#F3F3F0"], [fill="#F5F5F2"] { fill: #181818; }
    [fill="#ECECE9"], [fill="#D8D8D4"], [fill="#DBDBD7"],
    [fill="#E8E8E4"], [fill="#DCDCD8"] { fill: #454247; }
    [stroke="#ECECE9"], [stroke="#DBDBD7"], [stroke="#D8D8D4"],
    [stroke="#E8E8E4"] { stroke: #454247; }
    [fill="#181818"] { fill: #F7F7F5; }
    text[fill="#FFFFFF"] { fill: #000000; }
    [stroke="#181818"] { stroke: #F7F7F5; }
    [fill="#404040"], [fill="#9B9B9B"] { fill: #B7B5BB; }
    [stroke="#404040"], [stroke="#9B9B9B"] { stroke: #B7B5BB; }
    [fill="#E4EAFD"], [fill="#EDF1FE"], [fill="#EBEEFE"] { fill: #30324F; }
    [fill="#5B67D8"] { fill: #9BA6FF; }
    [stroke="#5B67D8"] { stroke: #9BA6FF; }
    [fill="#D4F0E3"], [fill="#E8F5EE"] { fill: #18372B; }
    [fill="#DEDEDA"], [fill="#DEDEDa"] { fill: #454247; }
    [fill="#FEF3D8"] { fill: #3A301C; }
    [fill="#A06A00"] { fill: #E9C77D; }
    [fill="#FDEAEA"] { fill: #421F23; }
    [fill="#C0252A"] { fill: #FFB4AB; }
    [fill="#1E7A4F"], [fill="#3DAA74"] { fill: #75D9A5; }
    [stroke="#1E7A4F"], [stroke="#3DAA74"] { stroke: #75D9A5; }
    [flood-color="#181818"] { flood-color: #000000; flood-opacity: 0.35; }
    .a { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; }

    @keyframes haloIn { 0% {opacity:0} 8% {opacity:1} 96% {opacity:1} 100% {opacity:0} }
    .halo { animation-name: haloIn; }

    @keyframes cardIn {
      0%, 3% { opacity:0; transform: translateY(18px) scale(0.965); }
      8.5%   { opacity:1; transform: translateY(-2px) scale(1.006); }
      11%    { transform: translateY(0) scale(1); }
      96%    { opacity:1; transform: none; }
      100%   { opacity:0; transform: none; }
    }
    .card { animation-name: cardIn; transform-box: fill-box; transform-origin: center; }

    @keyframes pillIn { 0%,9% {opacity:0; transform:scale(0)} 12% {opacity:1; transform:scale(1.1)} 14% {transform:scale(1)} 96% {opacity:1; transform:scale(1)} 100% {opacity:0; transform:scale(1)} }
    .pill { animation-name: pillIn; transform-box: fill-box; transform-origin: center; }

    @keyframes floatY { 0%{transform:translateY(0)} 50%{transform:translateY(-4px)} 100%{transform:translateY(0)} }
    .float  { animation: floatY 4.6s ease-in-out infinite; }
    .floatB { animation: floatY 5.4s ease-in-out infinite; animation-delay: -2.2s; }
    .floatC { animation: floatY 5s ease-in-out infinite; animation-delay: -1.1s; }

    @keyframes caretBlink {
      0%,13% {opacity:0}
      14% {opacity:1} 16% {opacity:0} 18% {opacity:1} 20% {opacity:0} 21.5% {opacity:1}
      23%,100% {opacity:0}
    }
    .caret { animation-name: caretBlink; }

    @keyframes scanClick {
      0%, 21% { transform: scale(1); }
      22.2%   { transform: scale(0.9); }
      23.5%   { transform: scale(1); }
      100%    { transform: scale(1); }
    }
    .scanBtn { animation-name: scanClick; transform-box: fill-box; transform-origin: center; }

    @keyframes clickRipple {
      0%, 21.8% { opacity: 0; transform: scale(0.5); }
      22.5%     { opacity: 0.7; transform: scale(0.7); }
      26%       { opacity: 0; transform: scale(1.5); }
      100%      { opacity: 0; transform: scale(1.5); }
    }
    .ripple { animation-name: clickRipple; transform-box: fill-box; transform-origin: center; }

    @keyframes linkIn { 0%,22% {opacity:0} 25% {opacity:0.9} 96% {opacity:0.9} 100% {opacity:0} }
    .links { animation-name: linkIn; }

    @keyframes dotV { 0%,23.6% {opacity:0} 25% {opacity:1} 28.6% {opacity:1} 30%,100% {opacity:0} }
    .dot { animation-name: dotV; }

    @keyframes beamSweep {
      0%, 28% { opacity:0; transform: translateY(0); }
      29.5%   { opacity:0.5; }
      34.5%   { opacity:0.5; transform: translateY(250px); }
      36%,100%{ opacity:0; transform: translateY(250px); }
    }
    .beam { animation-name: beamSweep; }

    /* ring: circumference 213.63, 72 percent = 153.81 */
    @keyframes ringDraw {
      0%, 34% { stroke-dasharray: 0 213.63; opacity: 0; }
      34.5%   { opacity: 1; }
      46%     { stroke-dasharray: 153.81 213.63; opacity: 1; }
      100%    { stroke-dasharray: 153.81 213.63; opacity: 1; }
    }
    .ringArc { animation-name: ringDraw; }
    @keyframes ringTrackIn { 0%,32% {opacity:0} 35% {opacity:1} 100% {opacity:1} }
    .ringTrack { animation-name: ringTrackIn; }

    @keyframes num1 { 0%,35% {opacity:0} 35.5% {opacity:1} 39.5% {opacity:1} 40%,100% {opacity:0} }
    @keyframes num2 { 0%,40% {opacity:0} 40.5% {opacity:1} 43.5% {opacity:1} 44%,100% {opacity:0} }
    @keyframes num3 { 0%,44% {opacity:0} 45% {opacity:1} 100% {opacity:1} }
    .num1{animation-name:num1}.num2{animation-name:num2}.num3{animation-name:num3}
    @keyframes ovIn { 0%,35% {opacity:0} 38% {opacity:1} 100% {opacity:1} }
    .overall { animation-name: ovIn; }

    @keyframes tagIn1 { 0%,44% {opacity:0; transform:scale(0)} 46.5% {opacity:1; transform:scale(1.12)} 48% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    @keyframes tagIn2 { 0%,46% {opacity:0; transform:scale(0)} 48.5% {opacity:1; transform:scale(1.12)} 50% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    .tag1{animation-name:tagIn1; transform-box:fill-box; transform-origin:center}
    .tag2{animation-name:tagIn2; transform-box:fill-box; transform-origin:center}
    @keyframes goalIn { 0%,48% {opacity:0} 52% {opacity:1} 100% {opacity:1} }
    .goal { animation-name: goalIn; }

    @keyframes labelsIn { 0%,50% {opacity:0; transform:translateY(6px)} 54% {opacity:1; transform:translateY(0)} 100% {opacity:1} }
    .labels { animation-name: labelsIn; }

    @keyframes barG1 { 0%,52% {transform:scaleX(0)} 57% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
    @keyframes barG2 { 0%,54% {transform:scaleX(0)} 59% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
    @keyframes barG3 { 0%,56% {transform:scaleX(0)} 61% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
    @keyframes barG4 { 0%,58% {transform:scaleX(0)} 63% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
    .bar1{animation-name:barG1; transform-box:fill-box; transform-origin:0% 50%}
    .bar2{animation-name:barG2; transform-box:fill-box; transform-origin:0% 50%}
    .bar3{animation-name:barG3; transform-box:fill-box; transform-origin:0% 50%}
    .bar4{animation-name:barG4; transform-box:fill-box; transform-origin:0% 50%}

    @keyframes scIn1 { 0%,57% {opacity:0} 59.5% {opacity:1} 100% {opacity:1} }
    @keyframes scIn2 { 0%,59% {opacity:0} 61.5% {opacity:1} 100% {opacity:1} }
    @keyframes scIn3 { 0%,61% {opacity:0} 63.5% {opacity:1} 100% {opacity:1} }
    @keyframes scIn4 { 0%,63% {opacity:0} 65.5% {opacity:1} 100% {opacity:1} }
    .sc1{animation-name:scIn1}.sc2{animation-name:scIn2}.sc3{animation-name:scIn3}.sc4{animation-name:scIn4}

    @keyframes chipC1 { 0%,64% {opacity:0; transform:scale(0)} 66% {opacity:1; transform:scale(1.15)} 67.5% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    @keyframes chipC2 { 0%,66% {opacity:0; transform:scale(0)} 68% {opacity:1; transform:scale(1.15)} 69.5% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    @keyframes chipC3 { 0%,68% {opacity:0; transform:scale(0)} 70% {opacity:1; transform:scale(1.15)} 71.5% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    .chipC1{animation-name:chipC1; transform-box:fill-box; transform-origin:center}
    .chipC2{animation-name:chipC2; transform-box:fill-box; transform-origin:center}
    .chipC3{animation-name:chipC3; transform-box:fill-box; transform-origin:center}

    @keyframes sideIn1 { 0%,15% {opacity:0; transform:scale(0)} 18% {opacity:1; transform:scale(1.1)} 20% {transform:scale(1)} 96% {opacity:1; transform:scale(1)} 100% {opacity:0; transform:scale(1)} }
    @keyframes sideIn2 { 0%,17% {opacity:0; transform:scale(0)} 20% {opacity:1; transform:scale(1.1)} 22% {transform:scale(1)} 96% {opacity:1; transform:scale(1)} 100% {opacity:0; transform:scale(1)} }
    .side1{animation-name:sideIn1; transform-box:fill-box; transform-origin:center}
    .side2{animation-name:sideIn2; transform-box:fill-box; transform-origin:center}

    @keyframes chipIn { 0%,72% {opacity:0; transform:translateY(20px)} 77% {opacity:1; transform:translateY(-2px)} 79% {transform:translateY(0)} 96% {opacity:1} 100% {opacity:0} }
    .fixChip { animation-name: chipIn; }

    @keyframes badgePop { 0%,78% {opacity:0; transform:scale(0)} 80.5% {opacity:1; transform:scale(1.18)} 82% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
    .impact { animation-name: badgePop; transform-box: fill-box; transform-origin: center; }

    @keyframes twinkle { 0%,100% {transform:scale(1) rotate(0deg)} 50% {transform:scale(1.18) rotate(12deg)} }
    .sparkle { animation: twinkle 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Halo rings (transparent canvas) -->
  <g class="a halo">
    <circle cx="400" cy="400" r="360" fill="#FFFFFF" opacity="0.28"/>
    <circle cx="400" cy="400" r="280" fill="#FFFFFF" opacity="0.42"/>
    <circle cx="400" cy="400" r="200" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- Connector -->
  <g class="a links" stroke="#CFC3D9" stroke-width="1.6" stroke-dasharray="1 6" stroke-linecap="round" fill="none">
    <path d="M 400 200 C 400 216, 400 232, 400 244"/>
  </g>

  <!-- URL scan pill -->
  <g class="a pill"><g class="float">
    <g filter="url(#shadowSm)"><rect x="250" y="150" width="300" height="44" rx="22" fill="#FFFFFF"/></g>
    <g stroke="#404040" stroke-width="1.6" fill="none">
      <circle cx="276" cy="172" r="8"/>
      <ellipse cx="276" cy="172" rx="3.6" ry="8"/>
      <line x1="268" y1="172" x2="284" y2="172"/>
    </g>
    <g clip-path="url(#domainClip)">
      <text x="296" y="176.5" font-size="13.5" font-weight="600" fill="#181818">checkgrow.com</text>
    </g>
    <rect class="a caret" x="298" y="181" width="12" height="1.8" rx="0.9" fill="#9BA6FF" opacity="0"/>
    <circle class="a ripple" cx="504" cy="172" r="24" stroke="#9BA6FF" stroke-width="2" fill="none" opacity="0"/>
    <g class="a scanBtn">
      <rect x="470" y="158" width="68" height="28" rx="14" fill="#9BA6FF"/>
      <text x="504" y="176" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Scan</text>
    </g>
  </g></g>

  <!-- Data dot -->
  <circle class="a dot" r="4.5" fill="#9BA6FF" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.24;0.30;1"
      path="M 400 200 C 400 216, 400 232, 400 244"/>
  </circle>

  <!-- Hero card -->
  <g class="a card">
    <g filter="url(#shadowMd)">
      <rect x="190" y="248" width="420" height="380" rx="20" fill="#FFFFFF"/>
    </g>

    <!-- Scan beam -->
    <g clip-path="url(#cardClip)">
      <rect class="a beam" x="214" y="310" width="372" height="26" rx="13" fill="#E4EAFD" opacity="0"/>
    </g>

    <!-- Header -->
    <rect x="218" y="272" width="30" height="30" rx="9" fill="#E4EAFD"/>
    <path d="M 233 278.5 C 234 283, 236.9 285.9, 241.4 286.9 C 236.9 287.9, 234 290.8, 233 295.3 C 232 290.8, 229.1 287.9, 224.6 286.9 C 229.1 285.9, 232 283, 233 278.5 Z" fill="#5B67D8"/>
    <text x="258" y="288" font-size="17" font-weight="600" fill="#181818">Website Report</text>
    <text x="258" y="307" font-size="11.5" fill="#9B9B9B">AI conversion audit · One click</text>
    <g fill="#D8D8D4">
      <circle cx="550" cy="287" r="2"/><circle cx="558" cy="287" r="2"/><circle cx="566" cy="287" r="2"/>
    </g>

    <!-- Overall score ring -->
    <circle class="a ringTrack" cx="266" cy="380" r="34" stroke="#ECECE9" stroke-width="7" fill="none"/>
    <g transform="translate(266 380) rotate(-90)">
      <circle class="a ringArc" cx="0" cy="0" r="34" stroke="#9BA6FF" stroke-width="7" fill="none" stroke-linecap="round"
              stroke-dasharray="153.81 213.63"/>
    </g>
    <g class="a num1" opacity="0"><text x="266" y="384" font-size="19" font-weight="700" fill="#181818" text-anchor="middle">28</text></g>
    <g class="a num2" opacity="0"><text x="266" y="384" font-size="19" font-weight="700" fill="#181818" text-anchor="middle">51</text></g>
    <g class="a num3"><text x="266" y="384" font-size="19" font-weight="700" fill="#181818" text-anchor="middle">72</text></g>
    <g class="a overall"><text x="266" y="398" font-size="7.5" font-weight="600" letter-spacing="1" fill="#9B9B9B" text-anchor="middle">OVERALL</text></g>

    <!-- Device tags -->
    <g class="a tag1">
      <rect x="330" y="346" width="112" height="24" rx="12" fill="#F2F2EF"/>
      <g stroke="#404040" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="341" y="352.5" width="12" height="8.5" rx="1.5"/>
        <line x1="345" y1="364" x2="349" y2="364"/>
      </g>
      <text x="360" y="362" font-size="11" font-weight="600" fill="#404040">Desktop</text>
      <circle cx="426" cy="358" r="7" fill="#D4F0E3"/>
      <path d="M 422.8 358 L 425 360.2 L 429.2 355.8" stroke="#1E7A4F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <g class="a tag2">
      <rect x="330" y="378" width="104" height="24" rx="12" fill="#F2F2EF"/>
      <g stroke="#404040" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="343" y="383.5" width="8.5" height="13" rx="1.8"/>
        <line x1="346" y1="393.5" x2="349" y2="393.5"/>
      </g>
      <text x="360" y="394" font-size="11" font-weight="600" fill="#404040">Mobile</text>
      <circle cx="418" cy="390" r="7" fill="#D4F0E3"/>
      <path d="M 414.8 390 L 417 392.2 L 421.2 387.8" stroke="#1E7A4F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <g class="a goal"><text x="330" y="422" font-size="11" fill="#9B9B9B">Goal: Trial signups</text></g>

    <line x1="218" y1="440" x2="582" y2="440" stroke="#ECECE9" stroke-width="1"/>

    <!-- Category bars -->
    <g class="a labels">
      <text x="218" y="466" font-size="12" fill="#404040">Messaging</text>
      <text x="218" y="494" font-size="12" fill="#404040">UX / UI</text>
      <text x="218" y="522" font-size="12" fill="#404040">Tracking</text>
      <text x="218" y="550" font-size="12" fill="#404040">Compliance</text>
      <rect x="330" y="458" width="180" height="8" rx="4" fill="#ECECE9"/>
      <rect x="330" y="486" width="180" height="8" rx="4" fill="#ECECE9"/>
      <rect x="330" y="514" width="180" height="8" rx="4" fill="#ECECE9"/>
      <rect x="330" y="542" width="180" height="8" rx="4" fill="#ECECE9"/>
    </g>
    <rect class="a bar1" x="330" y="458" width="146" height="8" rx="4" fill="#3DAA74"/>
    <rect class="a bar2" x="330" y="486" width="115" height="8" rx="4" fill="#F5A623"/>
    <rect class="a bar3" x="330" y="514" width="130" height="8" rx="4" fill="#3DAA74"/>
    <rect class="a bar4" x="330" y="542" width="86" height="8" rx="4" fill="#E5484D"/>
    <g class="a sc1"><text x="522" y="466" font-size="12" font-weight="700" fill="#181818">8.1</text></g>
    <g class="a sc2"><text x="522" y="494" font-size="12" font-weight="700" fill="#181818">6.4</text></g>
    <g class="a sc3"><text x="522" y="522" font-size="12" font-weight="700" fill="#181818">7.2</text></g>
    <g class="a sc4"><text x="522" y="550" font-size="12" font-weight="700" fill="#181818">4.8</text></g>

    <!-- Pass / partial / fail chips -->
    <g class="a chipC1">
      <rect x="218" y="576" width="66" height="22" rx="11" fill="#D4F0E3"/>
      <text x="251" y="590.5" font-size="11" font-weight="600" fill="#1E7A4F" text-anchor="middle">14 pass</text>
    </g>
    <g class="a chipC2">
      <rect x="294" y="576" width="72" height="22" rx="11" fill="#FEF3D8"/>
      <text x="330" y="590.5" font-size="11" font-weight="600" fill="#A06A00" text-anchor="middle">9 partial</text>
    </g>
    <g class="a chipC3">
      <rect x="376" y="576" width="54" height="22" rx="11" fill="#FDEAEA"/>
      <text x="403" y="590.5" font-size="11" font-weight="600" fill="#C0252A" text-anchor="middle">6 fail</text>
    </g>
  </g>

  <!-- Floating icon badges -->
  <g class="a side1"><g class="floatB">
    <g filter="url(#shadowSm)"><circle cx="140" cy="296" r="26" fill="#FFFFFF"/></g>
    <g stroke="#404040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 134 290 L 148 296.5 L 141.5 299 L 139 305.5 Z"/>
      <path d="M 143 301 L 148 306"/>
    </g>
  </g></g>

  <g class="a side2"><g class="floatC">
    <g filter="url(#shadowSm)"><circle cx="676" cy="420" r="26" fill="#FFFFFF"/></g>
    <g stroke="#404040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 676 409 C 680 412, 684 413, 687 413 C 687 421, 684 428, 676 431 C 668 428, 665 421, 665 413 C 668 413, 672 412, 676 409 Z"/>
      <path d="M 671.5 420 L 675 423.5 L 681 416.5"/>
    </g>
  </g></g>

  <!-- Top fix chip -->
  <g class="a fixChip">
    <g filter="url(#shadowLg)">
      <rect x="222" y="606" width="380" height="64" rx="32" fill="#FFFFFF"/>
    </g>
    <circle cx="254" cy="638" r="17" fill="#E4EAFD"/>
    <g class="sparkle">
      <path d="M 254 628.5 C 255.1 633.6, 258.4 636.9, 263.5 638 C 258.4 639.1, 255.1 642.4, 254 647.5 C 252.9 642.4, 249.6 639.1, 244.5 638 Z" fill="#5B67D8"/>
    </g>
    <text x="284" y="633" font-size="13" font-weight="600" fill="#181818">Add product UI to your hero</text>
    <text x="284" y="652" font-size="11.5" fill="#9B9B9B">Top fix · Highest impact found</text>
    <g class="a impact">
      <rect x="496" y="627" width="94" height="22" rx="11" fill="#D4F0E3"/>
      <text x="543" y="641.5" font-size="11" font-weight="600" fill="#1E7A4F" text-anchor="middle">+2× signups</text>
    </g>
  </g>
</svg>
